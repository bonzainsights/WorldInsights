<!-- Navigation Component -->
<!-- Modern responsive navbar with mobile hamburger menu -->

<nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 fixed top-0 left-0 right-0 z-40"
     x-data="{ searchOpen: false, searchQuery: '' }">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- Logo & Desktop Navigation -->
      <div class="flex items-center space-x-8">
        <!-- Logo -->
        <a href="/" class="flex items-center space-x-2 group" aria-label="WorldInsights Home">
          <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-lg flex items-center justify-center shadow-md group-hover:shadow-lg transition-shadow">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <span class="font-display font-bold text-xl text-gray-900 group-hover:text-primary-600 transition-colors">
            WorldInsights
          </span>
        </a>

        <!-- Desktop Navigation Links -->
        <div class="hidden md:flex items-center space-x-1">
          <a href="/" class="nav-link {% if request.endpoint == 'frontend.index' %}active{% endif %}">
            Home
          </a>
          <a href="/data-sources" class="nav-link {% if request.endpoint == 'data_sources.index' %}active{% endif %}">
            Explore Data
          </a>
          <a href="/dashboard/builder" class="nav-link {% if 'dashboard' in request.endpoint|default('') %}active{% endif %}">
            Dashboard
          </a>
          <a href="/visualization/globe" class="nav-link {% if 'visualization' in request.endpoint|default('') %}active{% endif %}">
            Visualizations
          </a>
          <a href="/about" class="nav-link {% if request.endpoint == 'frontend.about' %}active{% endif %}">
            About
          </a>
        </div>
      </div>

      <!-- Right Side: Search & Actions -->
      <div class="flex items-center space-x-4">
        <!-- Search Bar (Desktop) -->
        <div class="hidden lg:flex items-center">
          <div class="relative">
            <input 
              type="text" 
              x-model="searchQuery"
              @keydown.enter="window.location.href = '/data-sources?search=' + searchQuery"
              placeholder="Search indicators or countries..."
              class="w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow"
              aria-label="Search indicators or countries"
            />
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-7 7 7 7 0 017-7z"></path>
            </svg>
          </div>
        </div>

        <!-- Dark Mode Toggle -->
        <button
          @click="darkMode = !darkMode; if (darkMode) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }"
          class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-gray-300 dark:hover:bg-gray-800 rounded-lg transition-colors"
          aria-label="Toggle dark mode"
          :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>

        <!-- Mobile Menu Button -->
        <button 
          @click="mobileMenuOpen = !mobileMenuOpen"
          class="md:hidden p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
          aria-label="Toggle mobile menu"
          :aria-expanded="mobileMenuOpen"
        >
          <svg x-show="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg x-show="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    x-show="mobileMenuOpen"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="md:hidden bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 shadow-lg"
    @click.away="mobileMenuOpen = false"
  >
    <div class="px-4 py-4 space-y-3">
      <!-- Mobile Search -->
      <div class="relative mb-4">
        <input
          type="text"
          x-model="searchQuery"
          @keydown.enter="window.location.href = '/data-sources?search=' + searchQuery; mobileMenuOpen = false"
          placeholder="Search indicators or countries..."
          class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
          aria-label="Search indicators or countries"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-7 7 7 7 0 017-7z"></path>
        </svg>
      </div>

      <!-- Mobile Navigation Links -->
      <a href="/" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-primary-400 rounded-lg transition-colors {% if request.endpoint == 'frontend.index' %}bg-primary-50 text-primary-700{% endif %}">
        Home
      </a>
      <a href="/data-sources" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-primary-400 rounded-lg transition-colors {% if request.endpoint == 'data_sources.index' %}bg-primary-50 text-primary-700{% endif %}">
        Explore Data
      </a>
      <a href="/dashboard/builder" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-primary-400 rounded-lg transition-colors {% if 'dashboard' in request.endpoint|default('') %}bg-primary-50 text-primary-700{% endif %}">
        Dashboard
      </a>
      <a href="/visualization/globe" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-primary-400 rounded-lg transition-colors {% if 'visualization' in request.endpoint|default('') %}bg-primary-50 text-primary-700{% endif %}">
        Visualizations
      </a>
      <a href="/about" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-primary-400 rounded-lg transition-colors {% if request.endpoint == 'frontend.about' %}bg-primary-50 text-primary-700{% endif %}">
        About
      </a>
    </div>
  </div>
</nav>

<!-- Navigation Styles -->
<style>
  .nav-link {
    @apply px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 hover:bg-primary-50 dark:hover:bg-gray-700 rounded-md transition-colors;
  }
  .nav-link.active {
    @apply text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-gray-700;
  }
</style>
