<!-- Flash Messages Component -->
<!-- Displays success, error, warning, and info messages -->

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div x-data="{ messages: {{ messages|tojson }} }" 
         class="fixed top-20 right-4 z-50 space-y-2"
         x-init="$watch('messages', value => {
           if (value.length > 0) {
             setTimeout(() => messages.shift(), 5000);
           }
         })"
         aria-live="polite">
      
      <template x-for="(message, index) in messages" :key="index">
        <div 
          x-show="true"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-x-4"
          x-transition:enter-end="opacity-100 translate-x-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100 translate-x-0"
          x-transition:leave-end="opacity-0 translate-x-4"
          class="flex items-center p-4 rounded-lg shadow-lg max-w-sm card-hover"
          :class="{
            'bg-green-50 border-l-4 border-green-500 text-green-800': message[0] === 'success',
            'bg-red-50 border-l-4 border-red-500 text-red-800': message[0] === 'error',
            'bg-yellow-50 border-l-4 border-yellow-500 text-yellow-800': message[0] === 'warning',
            'bg-blue-50 border-l-4 border-blue-500 text-blue-800': message[0] === 'info'
          }"
          role="alert">
          
          <!-- Icon -->
          <svg x-show="message[0] === 'success'" class="w-5 h-5 mr-3 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <svg x-show="message[0] === 'error'" class="w-5 h-5 mr-3 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <svg x-show="message[0] === 'warning'" class="w-5 h-5 mr-3 text-yellow-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <svg x-show="message[0] === 'info'" class="w-5 h-5 mr-3 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          
          <!-- Message -->
          <p class="text-sm font-medium" x-text="message[1]"></p>
          
          <!-- Close button -->
          <button 
            @click="messages.splice(index, 1)"
            class="ml-auto -mx-1.5 -my-1.5 rounded-lg p-1.5 inline-flex h-8 w-8 hover:bg-gray-200 transition-colors"
            :class="{
              'text-green-500 hover:bg-green-100': message[0] === 'success',
              'text-red-500 hover:bg-red-100': message[0] === 'error',
              'text-yellow-500 hover:bg-yellow-100': message[0] === 'warning',
              'text-blue-500 hover:bg-blue-100': message[0] === 'info'
            }"
            aria-label="Dismiss">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </template>
    </div>
  {% endif %}
{% endwith %}
