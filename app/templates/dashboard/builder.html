<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Builder - WorldInsights</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- HTMX -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  
  <!-- Interact.js for drag-drop -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>

  <style>
    /* Canvas styles */
    .dashboard-canvas {
      background-image: 
        linear-gradient(#e5e7eb 1px, transparent 1px),
        linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: center center;
    }
    
    .dark .dashboard-canvas {
      background-image: 
        linear-gradient(#374151 1px, transparent 1px),
        linear-gradient(90deg, #374151 1px, transparent 1px);
    }
    
    /* Panel styles */
    .dashboard-panel {
      touch-action: none;
      user-select: none;
    }
    
    .panel-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
    }
    
    /* Canvas controls */
    .canvas-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
    }
    
    /* Loading states */
    .loading-skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s ease-in-out infinite;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100"
      x-data="dashboardBuilder()"
      x-init="initDashboard()">
  
  <!-- Navigation (simplified for builder) -->
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 fixed top-0 left-0 right-0 z-50 h-14">
    <div class="h-full px-4 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <h1 class="text-lg font-bold">Dashboard Builder</h1>
        <span class="text-sm text-gray-500" x-show="currentDashboard.title" x-text="currentDashboard.title"></span>
      </div>
      
      <div class="flex items-center space-x-2">
        <button @click="saveDashboard()" class="px-3 py-1.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm">
          💾 Save
        </button>
        <button @click="loadDashboard()" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 text-sm">
          📂 Open
        </button>
        <button @click="exportDashboard('png')" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 text-sm">
          📤 Export
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Layout -->
  <div class="flex h-screen pt-14">
    
    <!-- Left Panel: Data Selection -->
    <div class="w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 overflow-y-auto">
      <div class="p-4 space-y-4">
        
        <!-- Provider Selection -->
        <div>
          <label class="block text-sm font-medium mb-2">Data Provider</label>
          <select 
            x-model="filters.provider"
            @change="onProviderChange()"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary-500">
            <option value="">Select Provider...</option>
            <option value="world_bank">World Bank</option>
            <option value="who">WHO</option>
            <option value="fao">FAO</option>
            <option value="nasa">NASA</option>
            <option value="open_meteo">Open-Meteo</option>
          </select>
        </div>

        <!-- Indicator Selection -->
        <div x-show="filters.provider">
          <label class="block text-sm font-medium mb-2">
            Indicators
            <span class="text-xs text-gray-500" x-text="`(${availability.counts.filtered_indicators || 0} available)`"></span>
          </label>
          
          <div class="relative mb-2">
            <input
              type="text"
              x-model="searches.indicator"
              placeholder="Search indicators..."
              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm"
            />
          </div>
          
          <div class="max-h-48 overflow-y-auto border border-gray-300 dark:border-gray-600 rounded-lg">
            <template x-for="indicator in filteredIndicators" :key="indicator.code">
              <label class="flex items-center px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
                <input
                  type="checkbox"
                  :value="indicator.code"
                  x-model="filters.indicators"
                  @change="onSelectionChange()"
                  class="mr-2"
                />
                <span class="text-sm" x-text="indicator.name"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Country Selection -->
        <div x-show="filters.provider && filters.indicators.length > 0">
          <label class="block text-sm font-medium mb-2">
            Countries
            <span class="text-xs text-gray-500" x-text="`(${availability.counts.filtered_countries || 0} available)`"></span>
          </label>
          
          <div class="relative mb-2">
            <input
              type="text"
              x-model="searches.country"
              placeholder="Search countries..."
              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm"
            />
          </div>
          
          <div class="max-h-48 overflow-y-auto border border-gray-300 dark:border-gray-600 rounded-lg">
            <template x-for="country in filteredCountries" :key="country.code">
              <label class="flex items-center px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
                <input
                  type="checkbox"
                  :value="country.code"
                  x-model="filters.countries"
                  @change="onSelectionChange()"
                  class="mr-2"
                />
                <span class="text-sm" x-text="country.name"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Year Range -->
        <div x-show="filters.countries.length > 0">
          <label class="block text-sm font-medium mb-2">Year Range</label>
          <div class="grid grid-cols-2 gap-2">
            <input
              type="number"
              x-model="filters.start_year"
              :min="availability.years.min_year"
              :max="availability.years.max_year"
              placeholder="From"
              class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm"
            />
            <input
              type="number"
              x-model="filters.end_year"
              :min="availability.years.min_year"
              :max="availability.years.max_year"
              placeholder="To"
              class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm"
            />
          </div>
        </div>

        <!-- Chart Type -->
        <div x-show="filters.countries.length > 0 && filters.indicators.length > 0">
          <label class="block text-sm font-medium mb-2">Chart Type</label>
          <select
            x-model="filters.chart_type"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary-500">
            <option value="line">Line Chart</option>
            <option value="bar">Bar Chart</option>
            <option value="scatter">Scatter Plot</option>
            <option value="area">Area Chart</option>
          </select>
        </div>

        <!-- Add to Dashboard Button -->
        <button
          x-show="filters.countries.length > 0 && filters.indicators.length > 0"
          @click="addChartPanel()"
          class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 font-medium">
          ➕ Add Chart to Dashboard
        </button>

      </div>
    </div>

    <!-- Center: Canvas Area -->
    <div class="flex-1 relative overflow-hidden">
      
      <!-- Canvas -->
      <div 
        id="dashboard-canvas"
        class="dashboard-canvas w-full h-full relative"
        @wheel="handleZoom">
        
        <!-- Panels -->
        <template x-for="panel in panels" :key="panel.id">
          <div
            :id="panel.id"
            class="dashboard-panel absolute bg-white dark:bg-gray-800 border-2 rounded-lg shadow-lg"
            :class="selectedPanel === panel.id ? 'border-primary-500' : 'border-gray-300 dark:border-gray-600'"
            :style="{
              left: panel.x + 'px',
              top: panel.y + 'px',
              width: panel.width + 'px',
              height: panel.height + 'px',
              zIndex: panel.zIndex
            }"
            @mousedown="selectPanel(panel.id)"
            @click.stop>
            
            <!-- Panel Header -->
            <div class="panel-header h-10 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-3 bg-gray-50 dark:bg-gray-700 cursor-move">
              <span class="text-sm font-medium" x-text="panel.title"></span>
              <div class="flex items-center space-x-1">
                <button @click="bringToFront(panel.id)" class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="Bring to front">⬆️</button>
                <button @click="editPanel(panel.id)" class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="Edit">✏️</button>
                <button @click="removePanel(panel.id)" class="p-1 hover:bg-red-200 dark:hover:bg-red-900 rounded text-red-600" title="Remove">❌</button>
              </div>
            </div>
            
            <!-- Panel Content -->
            <div class="panel-content h-[calc(100%-2.5rem)] p-3 overflow-auto">
              <template x-if="panel.type === 'chart'">
                <div :id="`chart-${panel.id}`" class="w-full h-full" x-init="renderChart(panel)"></div>
              </template>
              <template x-if="panel.type === 'text'">
                <div class="prose dark:prose-invert" x-html="panel.content"></div>
              </template>
            </div>
            
            <!-- Resize Handle -->
            <div class="panel-resize-handle" :data-panel-id="panel.id"></div>
          </div>
        </template>
        
      </div>
      
      <!-- Canvas Controls -->
      <div class="canvas-controls bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 p-2 flex items-center space-x-2">
        <button @click="zoomIn()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded" title="Zoom In">🔍+</button>
        <button @click="zoomOut()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded" title="Zoom Out">🔍-</button>
        <button @click="resetZoom()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded" title="Reset Zoom">1:1</button>
        <div class="w-px h-6 bg-gray-300 dark:bg-gray-600"></div>
        <button @click="toggleGrid()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded" :class="canvas.showGrid ? 'bg-primary-100 dark:bg-primary-900' : ''" title="Toggle Grid">⊞</button>
        <button @click="fitToScreen()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded" title="Fit to Screen">⛶</button>
      </div>
      
    </div>

    <!-- Right Panel: Properties -->
    <div class="w-72 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 overflow-y-auto">
      <div class="p-4">
        <h3 class="text-sm font-bold mb-4">Properties</h3>
        
        <template x-if="selectedPanel && getPanel(selectedPanel)">
          <div class="space-y-4">
            <template x-if="getPanel(selectedPanel).type === 'chart'">
              <div>
                <label class="block text-sm font-medium mb-2">Chart Title</label>
                <input
                  type="text"
                  x-model="getPanel(selectedPanel).title"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm"
                />
              </div>
            </template>
            
            <div>
              <label class="block text-sm font-medium mb-2">Position</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="number" x-model="getPanel(selectedPanel).x" placeholder="X" class="px-2 py-1 border rounded text-sm" />
                <input type="number" x-model="getPanel(selectedPanel).y" placeholder="Y" class="px-2 py-1 border rounded text-sm" />
              </div>
            </div>
            
            <div>
              <label class="block text-sm font-medium mb-2">Size</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="number" x-model="getPanel(selectedPanel).width" placeholder="W" class="px-2 py-1 border rounded text-sm" />
                <input type="number" x-model="getPanel(selectedPanel).height" placeholder="H" class="px-2 py-1 border rounded text-sm" />
              </div>
            </div>
          </div>
        </template>
        
        <template x-if="!selectedPanel">
          <p class="text-sm text-gray-500">Select a panel to edit its properties</p>
        </template>
      </div>
    </div>
    
  </div>

  <!-- JavaScript -->
  <script>
    function dashboardBuilder() {
      return {
        // State
        filters: {
          provider: '',
          indicators: [],
          countries: [],
          start_year: null,
          end_year: null,
          chart_type: 'line'
        },
        
        searches: {
          indicator: '',
          country: ''
        },
        
        availability: {
          providers: [],
          indicators: [],
          countries: [],
          years: { min_year: null, max_year: null },
          counts: {
            total_providers: 0,
            total_indicators: 0,
            total_countries: 0,
            filtered_indicators: 0,
            filtered_countries: 0
          }
        },
        
        panels: [],
        selectedPanel: null,
        canvas: {
          zoom: 1,
          panX: 0,
          panY: 0,
          showGrid: true
        },
        
        currentDashboard: {
          id: null,
          title: '',
          description: ''
        },
        
        // Initialization
        initDashboard() {
          this.loadAvailability();
          this.initDragDrop();
          this.initResize();
          this.autoSave();
        },
        
        // Data Loading
        async loadAvailability() {
          if (!this.filters.provider) return;
          
          try {
            const params = new URLSearchParams({
              provider: this.filters.provider,
              countries: this.filters.countries.join(','),
              indicators: this.filters.indicators.join(',')
            });
            
            const response = await fetch(`/dashboard/api/availability/summary?${params}`);
            this.availability = await response.json();
          } catch (error) {
            console.error('Error loading availability:', error);
          }
        },
        
        // Event Handlers
        async onProviderChange() {
          this.filters.indicators = [];
          this.filters.countries = [];
          await this.loadAvailability();
        },
        
        async onSelectionChange() {
          await this.loadAvailability();
        },
        
        // Computed Properties (manual)
        get filteredIndicators() {
          if (!this.searches.indicator) return this.availability.indicators || [];
          const search = this.searches.indicator.toLowerCase();
          return (this.availability.indicators || []).filter(ind => 
            ind.name.toLowerCase().includes(search) ||
            ind.code.toLowerCase().includes(search)
          );
        },
        
        get filteredCountries() {
          if (!this.searches.country) return this.availability.countries || [];
          const search = this.searches.country.toLowerCase();
          return (this.availability.countries || []).filter(country =>
            country.name.toLowerCase().includes(search) ||
            country.code.toLowerCase().includes(search)
          );
        },
        
        // Panel Management
        addChartPanel() {
          const panel = {
            id: `panel-${Date.now()}`,
            type: 'chart',
            title: `${this.filters.indicators.length} indicators across ${this.filters.countries.length} countries`,
            x: 100 + (this.panels.length * 20),
            y: 100 + (this.panels.length * 20),
            width: 500,
            height: 350,
            zIndex: this.panels.length + 1,
            config: {
              provider: this.filters.provider,
              indicators: [...this.filters.indicators],
              countries: [...this.filters.countries],
              start_year: this.filters.start_year,
              end_year: this.filters.end_year,
              chart_type: this.filters.chart_type
            },
            data: null
          };
          
          this.panels.push(panel);
          this.fetchPanelData(panel);
          this.$nextTick(() => {
            this.initDragDrop();
            this.initResize();
          });
        },
        
        async fetchPanelData(panel) {
          try {
            const response = await fetch('/dashboard/api/data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(panel.config)
            });
            
            const result = await response.json();
            panel.data = result;
            
            if (result.plot_config) {
              this.renderChart(panel);
            }
          } catch (error) {
            console.error('Error fetching panel data:', error);
          }
        },
        
        renderChart(panel) {
          if (!panel.data || !panel.data.plot_config) return;
          
          const chartId = `chart-${panel.id}`;
          const config = panel.data.plot_config;
          
          Plotly.newPlot(chartId, config.data, config.layout, {
            responsive: true,
            displayModeBar: true,
            modeBarButtonsToRemove: ['lasso2d', 'select2d']
          });
        },
        
        selectPanel(panelId) {
          this.selectedPanel = panelId;
          this.bringToFront(panelId);
        },
        
        removePanel(panelId) {
          this.panels = this.panels.filter(p => p.id !== panelId);
          this.selectedPanel = null;
        },
        
        bringToFront(panelId) {
          const maxZ = Math.max(...this.panels.map(p => p.zIndex), 0);
          const panel = this.panels.find(p => p.id === panelId);
          if (panel) {
            panel.zIndex = maxZ + 1;
          }
        },
        
        getPanel(panelId) {
          return this.panels.find(p => p.id === panelId);
        },
        
        editPanel(panelId) {
          // Open edit modal (future implementation)
          console.log('Edit panel:', panelId);
        },
        
        // Canvas Controls
        handleZoom(e) {
          e.preventDefault();
          const delta = e.deltaY > 0 ? -0.1 : 0.1;
          this.canvas.zoom = Math.max(0.5, Math.min(2, this.canvas.zoom + delta));
        },
        
        zoomIn() {
          this.canvas.zoom = Math.min(2, this.canvas.zoom + 0.1);
        },
        
        zoomOut() {
          this.canvas.zoom = Math.max(0.5, this.canvas.zoom - 0.1);
        },
        
        resetZoom() {
          this.canvas.zoom = 1;
        },
        
        toggleGrid() {
          this.canvas.showGrid = !this.canvas.showGrid;
        },
        
        fitToScreen() {
          this.resetZoom();
          // Center all panels (future implementation)
        },
        
        // Drag & Drop (Interact.js)
        initDragDrop() {
          interact('.dashboard-panel').draggable({
            listeners: {
              move: (event) => {
                const panelId = event.target.id;
                const panel = this.getPanel(panelId);
                if (panel) {
                  panel.x = (panel.x || 0) + event.dx;
                  panel.y = (panel.y || 0) + event.dy;
                }
              }
            },
            modifiers: [
              interact.modifiers.restrictRect({
                restriction: 'parent',
                endOnly: true
              })
            ]
          });
        },
        
        // Resize (Interact.js)
        initResize() {
          interact('.panel-resize-handle').forEachTarget((target) => {
            interact(target).resizable({
              listeners: {
                move: (event) => {
                  const panelId = event.target.dataset.panelId;
                  const panel = this.getPanel(panelId);
                  if (panel) {
                    panel.width = parseFloat(event.rect.width);
                    panel.height = parseFloat(event.rect.height);
                  }
                }
              },
              modifiers: [
                interact.modifiers.restrictSize({
                  min: { width: 300, height: 200 }
                })
              ]
            });
          });
        },
        
        // Save/Load
        async saveDashboard() {
          const title = prompt('Enter dashboard title:', 'My Dashboard');
          if (!title) return;
          
          this.currentDashboard.title = title;
          
          const dashboard = {
            title: title,
            layout: {
              zoom: this.canvas.zoom,
              showGrid: this.canvas.showGrid
            },
            panels: this.panels.map(p => ({
              id: p.id,
              type: p.type,
              title: p.title,
              x: p.x,
              y: p.y,
              width: p.width,
              height: p.height,
              zIndex: p.zIndex,
              config: p.config
            }))
          };
          
          try {
            const response = await fetch('/dashboard/api/save', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(dashboard)
            });
            
            const result = await response.json();
            alert('Dashboard saved! ID: ' + result.id);
          } catch (error) {
            console.error('Error saving dashboard:', error);
            alert('Error saving dashboard');
          }
        },
        
        async loadDashboard() {
          const dashboardId = prompt('Enter dashboard ID:');
          if (!dashboardId) return;
          
          try {
            const response = await fetch(`/dashboard/api/load/${dashboardId}`);
            const dashboard = await response.json();
            
            if (dashboard.panels) {
              this.panels = dashboard.panels;
              this.canvas.zoom = dashboard.layout?.zoom || 1;
              this.canvas.showGrid = dashboard.layout?.showGrid ?? true;
            }
          } catch (error) {
            console.error('Error loading dashboard:', error);
            alert('Error loading dashboard');
          }
        },
        
        async exportDashboard(format) {
          alert(`${format.toUpperCase()} export will be available in future update`);
        },
        
        // Auto-save
        autoSave() {
          setInterval(() => {
            if (this.panels.length > 0) {
              console.log('Auto-saving dashboard...');
              // Silent auto-save (future implementation)
            }
          }, 30000); // Every 30 seconds
        }
      }
    }
  </script>
</body>
</html>
