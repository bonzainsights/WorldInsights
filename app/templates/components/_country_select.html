<!-- Country Multi-Select Component -->
<!-- Usage: Include in any page that needs country selection -->
<!-- Requires Alpine.js and WorldInsightsAPI -->

<div x-data="countrySelectComponent()"
     x-init="init()"
     class="country-select-component">
  
  <!-- Search Input -->
  <div class="relative mb-3">
    <input type="text"
           x-model="searchQuery"
           @input="search()"
           :placeholder="placeholder"
           class="w-full pl-10 pr-10 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
           aria-label="Search countries">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-7 7 7 7 0 017-7z"></path>
    </svg>
    <button x-show="searchQuery"
            @click="searchQuery = ''; search()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Select All Button -->
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs text-gray-500" x-text="selectedCountries.length + ' selected'"></span>
    <button @click="toggleSelectAll()"
            class="text-xs text-primary-600 hover:text-primary-700 font-medium">
      <span x-text="allVisibleSelected ? 'Deselect All' : 'Select All Visible'"></span>
    </button>
  </div>

  <!-- Country List -->
  <div class="border border-gray-300 rounded-lg max-h-64 overflow-y-auto">
    <div class="divide-y divide-gray-200">
      <template x-if="filteredCountries.length === 0">
        <div class="p-4 text-center text-sm text-gray-500">
          No countries found
        </div>
      </template>
      <template x-for="country in filteredCountries" :key="country.code">
        <label class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer transition-colors">
          <input type="checkbox"
                 :value="country.code"
                 x-model="selectedCountries"
                 @change="onChange()"
                 class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
          <span class="ml-3 text-sm text-gray-700" x-text="country.name"></span>
          <span class="ml-auto text-xs text-gray-400 font-mono" x-text="country.code"></span>
        </label>
      </template>
    </div>
  </div>

  <!-- Selected Countries Tags -->
  <div x-show="selectedCountries.length > 0" class="mt-3 flex flex-wrap gap-2">
    <template x-for="code in selectedCountries" :key="code">
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-primary-100 text-primary-700">
        <span x-text="getCountryName(code)"></span>
        <button @click="removeCountry(code)" class="ml-1.5 text-primary-500 hover:text-primary-700">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </span>
    </template>
  </div>

</div>

<script>
/**
 * Country Select Component
 * @returns {Object} Alpine.js component
 */
function countrySelectComponent() {
  return {
    // Props (set via data attributes or parent component)
    modelValue: [],
    placeholder: 'Search countries...',
    maxVisible: 100,

    // State
    allCountries: [],
    filteredCountries: [],
    selectedCountries: [],
    searchQuery: '',
    isLoading: false,

    /**
     * Initialize component
     */
    async init() {
      this.selectedCountries = this.modelValue || [];
      await this.loadCountries();
      this.filteredCountries = this.allCountries.slice(0, this.maxVisible);
    },

    /**
     * Load countries from API
     */
    async loadCountries() {
      this.isLoading = true;
      try {
        this.allCountries = await WorldInsightsAPI.getCountries();
        console.log(`[CountrySelect] Loaded ${this.allCountries.length} countries`);
      } catch (error) {
        console.error('[CountrySelect] Error loading countries:', error);
        // Fallback to empty list
        this.allCountries = [];
      } finally {
        this.isLoading = false;
      }
    },

    /**
     * Search countries (debounced)
     */
    search: debounce(function() {
      const query = this.searchQuery.toLowerCase().trim();
      
      if (!query) {
        this.filteredCountries = this.allCountries.slice(0, this.maxVisible);
        return;
      }

      this.filteredCountries = this.allCountries.filter(country => 
        country.name.toLowerCase().includes(query) ||
        country.code.toLowerCase().includes(query)
      ).slice(0, this.maxVisible);
    }, 300),

    /**
     * Toggle select all visible countries
     */
    toggleSelectAll() {
      const visibleCodes = this.filteredCountries.map(c => c.code);
      
      if (this.allVisibleSelected) {
        // Deselect all visible
        this.selectedCountries = this.selectedCountries.filter(
          code => !visibleCodes.includes(code)
        );
      } else {
        // Select all visible
        const newSelection = [...new Set([...this.selectedCountries, ...visibleCodes])];
        this.selectedCountries = newSelection;
      }
      
      this.onChange();
    },

    /**
     * Check if all visible countries are selected
     */
    get allVisibleSelected() {
      const visibleCodes = this.filteredCountries.map(c => c.code);
      return visibleCodes.length > 0 && 
             visibleCodes.every(code => this.selectedCountries.includes(code));
    },

    /**
     * Remove a country from selection
     */
    removeCountry(code) {
      this.selectedCountries = this.selectedCountries.filter(c => c !== code);
      this.onChange();
    },

    /**
     * Get country name by code
     */
    getCountryName(code) {
      const country = this.allCountries.find(c => c.code === code);
      return country ? country.name : code;
    },

    /**
     * Emit change event
     */
    onChange() {
      // Dispatch custom event for parent components
      this.$el.dispatchEvent(new CustomEvent('country-change', {
        bubbles: true,
        detail: { countries: this.selectedCountries }
      }));
    }
  };
}

// Debounce utility
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}
</script>
