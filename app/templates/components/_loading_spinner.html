<!-- Loading Spinner Component -->
<!-- Usage: Include where loading state is needed -->

<!-- Small Spinner -->
<div class="spinner" 
     aria-label="Loading">
</div>

<!-- Large Spinner -->
<div class="spinner spinner-lg" 
     aria-label="Loading">
</div>

<!-- Full Page Loading Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 backdrop-blur-sm"
     aria-label="Loading"
     role="status">
  <div class="text-center">
    <svg class="animate-spin w-12 h-12 text-primary-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-gray-600 font-medium">Loading...</p>
  </div>
</div>

<!-- Inline Loading with Text -->
<div class="flex items-center justify-center space-x-2"
     aria-label="Loading"
     role="status">
  <svg class="animate-spin w-5 h-5 text-primary-600" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  <span class="text-gray-600 text-sm">Loading...</span>
</div>

<!-- Button Loading State -->
<button disabled class="inline-flex items-center px-4 py-2 bg-primary-600 text-white rounded-lg opacity-75 cursor-not-allowed">
  <svg class="animate-spin w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  Loading...
</button>

<!-- Skeleton Loading -->
<div class="animate-pulse space-y-3">
  <div class="h-4 bg-gray-200 rounded w-3/4"></div>
  <div class="h-4 bg-gray-200 rounded"></div>
  <div class="h-4 bg-gray-200 rounded w-5/6"></div>
</div>

<!-- Card Skeleton -->
<div class="animate-pulse bg-white rounded-xl p-6 border border-gray-200">
  <div class="flex items-center space-x-4 mb-4">
    <div class="w-12 h-12 bg-gray-200 rounded-full"></div>
    <div class="flex-1 space-y-2">
      <div class="h-4 bg-gray-200 rounded w-1/2"></div>
      <div class="h-3 bg-gray-200 rounded w-1/3"></div>
    </div>
  </div>
  <div class="space-y-2">
    <div class="h-3 bg-gray-200 rounded"></div>
    <div class="h-3 bg-gray-200 rounded w-5/6"></div>
  </div>
</div>

<!-- Table Skeleton -->
<div class="animate-pulse space-y-4">
  <div class="h-10 bg-gray-200 rounded"></div>
  <div class="h-10 bg-gray-200 rounded"></div>
  <div class="h-10 bg-gray-200 rounded"></div>
  <div class="h-10 bg-gray-200 rounded"></div>
</div>

<!-- Chart Skeleton -->
<div class="animate-pulse bg-white rounded-xl p-6 border border-gray-200">
  <div class="h-6 bg-gray-200 rounded w-1/3 mb-4"></div>
  <div class="h-64 bg-gray-200 rounded"></div>
</div>

<!-- Spinner CSS (include in your stylesheet) -->
<style>
  .spinner {
    border: 3px solid #e2e8f0;
    border-top: 3px solid #3b82f6;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spin 1s linear infinite;
  }
  
  .spinner-lg {
    width: 40px;
    height: 40px;
    border-width: 4px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
