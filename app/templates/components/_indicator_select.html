<!-- Indicator Select Component -->
<!-- Usage: Include in any page that needs indicator selection -->
<!-- Requires Alpine.js and WorldInsightsAPI -->

<div x-data="indicatorSelectComponent()"
     x-init="init()"
     class="indicator-select-component">
  
  <!-- Source Filter -->
  <div class="mb-3">
    <label class="block text-xs font-medium text-gray-700 mb-1">Data Source</label>
    <select x-model="selectedSource"
            @change="loadIndicators()"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
      <option value="all">All Sources</option>
      <option value="worldbank">World Bank</option>
      <option value="who">WHO</option>
      <option value="fao">FAO</option>
      <option value="nasa">NASA/NOAA</option>
      <option value="openmeteo">Open-Meteo</option>
    </select>
  </div>

  <!-- Search Input -->
  <div class="relative mb-3">
    <input type="text"
           x-model="searchQuery"
           @input="search()"
           :placeholder="placeholder"
           class="w-full pl-10 pr-10 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
           aria-label="Search indicators">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-7 7 7 7 0 017-7z"></path>
    </svg>
    <button x-show="searchQuery"
            @click="searchQuery = ''; search()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Results Count -->
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs text-gray-500" x-text="selectedIndicators.length + ' selected'"></span>
    <span class="text-xs text-gray-400" x-text="filteredIndicators.length + ' available'"></span>
  </div>

  <!-- Indicator List -->
  <div class="border border-gray-300 rounded-lg max-h-80 overflow-y-auto">
    <div class="divide-y divide-gray-200">
      <template x-if="isLoading">
        <div class="p-8 text-center">
          <svg class="animate-spin w-6 h-6 text-primary-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="text-xs text-gray-500">Loading indicators...</p>
        </div>
      </template>
      <template x-else-if="filteredIndicators.length === 0">
        <div class="p-4 text-center text-sm text-gray-500">
          No indicators found
        </div>
      </template>
      <template x-for="indicator in filteredIndicators" :key="indicator.code">
        <label class="flex items-start px-3 py-3 hover:bg-gray-50 cursor-pointer transition-colors">
          <input type="checkbox"
                 :value="indicator.code"
                 x-model="selectedIndicators"
                 @change="onChange()"
                 class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 mt-0.5">
          <div class="ml-3 flex-1 min-w-0">
            <div class="flex items-center flex-wrap gap-1 mb-1">
              <span class="text-sm text-gray-900 truncate" x-text="indicator.name"></span>
              <span class="inline-flex px-1.5 py-0.5 text-xs font-medium rounded bg-gray-100 text-gray-600"
                    :class="getSourceBadgeClass(indicator.source)"
                    x-text="indicator.source">
              </span>
            </div>
            <div class="text-xs text-gray-500 font-mono" x-text="indicator.code"></div>
            <div class="text-xs text-gray-400 mt-1 truncate" x-text="indicator.description || 'No description'"></div>
          </div>
        </label>
      </template>
    </div>
  </div>

  <!-- Selected Indicators Tags -->
  <div x-show="selectedIndicators.length > 0" class="mt-3">
    <div class="text-xs text-gray-500 mb-2">Selected Indicators:</div>
    <div class="flex flex-wrap gap-2">
      <template x-for="code in selectedIndicators" :key="code">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-primary-100 text-primary-700 max-w-full">
          <span class="truncate" x-text="getIndicatorName(code)"></span>
          <button @click="removeIndicator(code)" class="ml-1.5 text-primary-500 hover:text-primary-700 flex-shrink-0">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </span>
      </template>
    </div>
  </div>

</div>

<script>
/**
 * Indicator Select Component
 * @returns {Object} Alpine.js component
 */
function indicatorSelectComponent() {
  return {
    // Props
    modelValue: [],
    placeholder: 'Search indicators...',
    maxVisible: 50,

    // State
    selectedSource: 'all',
    allIndicators: [],
    filteredIndicators: [],
    selectedIndicators: [],
    searchQuery: '',
    isLoading: false,

    /**
     * Initialize component
     */
    async init() {
      this.selectedIndicators = this.modelValue || [];
      await this.loadIndicators();
    },

    /**
     * Load indicators from API
     */
    async loadIndicators() {
      this.isLoading = true;
      try {
        const source = this.selectedSource === 'all' ? null : this.selectedSource;
        this.allIndicators = await WorldInsightsAPI.getIndicators(source);
        console.log(`[IndicatorSelect] Loaded ${this.allIndicators.length} indicators`);
        this.search();
      } catch (error) {
        console.error('[IndicatorSelect] Error loading indicators:', error);
        this.allIndicators = [];
      } finally {
        this.isLoading = false;
      }
    },

    /**
     * Search indicators (debounced)
     */
    search: debounce(function() {
      let filtered = [...this.allIndicators];

      // Filter by search query
      const query = this.searchQuery.toLowerCase().trim();
      if (query) {
        filtered = filtered.filter(indicator => 
          (indicator.name || '').toLowerCase().includes(query) ||
          (indicator.code || '').toLowerCase().includes(query) ||
          (indicator.description || '').toLowerCase().includes(query)
        );
      }

      this.filteredIndicators = filtered.slice(0, this.maxVisible);
    }, 300),

    /**
     * Remove an indicator from selection
     */
    removeIndicator(code) {
      this.selectedIndicators = this.selectedIndicators.filter(c => c !== code);
      this.onChange();
    },

    /**
     * Get indicator name by code
     */
    getIndicatorName(code) {
      const indicator = this.allIndicators.find(i => i.code === code);
      return indicator ? indicator.name : code;
    },

    /**
     * Get source badge class
     */
    getSourceBadgeClass(source) {
      const classes = {
        worldbank: 'bg-blue-100 text-blue-700',
        who: 'bg-red-100 text-red-700',
        fao: 'bg-green-100 text-green-700',
        nasa: 'bg-purple-100 text-purple-700',
        openmeteo: 'bg-cyan-100 text-cyan-700'
      };
      return classes[source] || 'bg-gray-100 text-gray-700';
    },

    /**
     * Emit change event
     */
    onChange() {
      this.$el.dispatchEvent(new CustomEvent('indicator-change', {
        bubbles: true,
        detail: { indicators: this.selectedIndicators }
      }));
    }
  };
}

// Debounce utility
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}
</script>
