name: Verify Life Expectancy Global Release

on:
  pull_request:
    branches:
      - agent/add-life-expectancy-indicator
    paths:
      - .github/workflows/verify-life-expectancy-global.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/verify-life-expectancy-global'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and TypeScript
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          npm install --global typescript@5.8.3

      - name: Build live global release
        env:
          WORLDINSIGHTS_RELEASE_MODE: live
          WORLDINSIGHTS_RELEASE_SCOPE: global
          WORLDINSIGHTS_START_YEAR: "2019"
          WORLDINSIGHTS_END_YEAR: "2024"
        run: npm --prefix apps/web run build

      - name: Validate life expectancy release metadata and paired coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/web/dist/data")
          latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          catalog_path = root / latest["catalog"]
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          indicators = {
              item["indicator_variant_id"]: item
              for item in catalog["indicators"]
          }
          required = {
              "wb.ny.gdp.pcap.cd",
              "wb.sp.dyn.le00.in",
              "wb.sp.pop.totl",
          }
          if set(indicators) != required:
              raise RuntimeError(f"unexpected indicator set: {sorted(indicators)}")
          if len(catalog["geographies"]) < 200:
              raise RuntimeError("global catalog has fewer than 200 geographies")

          life = indicators["wb.sp.dyn.le00.in"]
          if life["provider_indicator_code"] != "SP.DYN.LE00.IN":
              raise RuntimeError("life expectancy provider identity mismatch")
          if life["concept_id"] != "health.life_expectancy_at_birth.total":
              raise RuntimeError("life expectancy concept mismatch")
          if life["unit_id"] != "years":
              raise RuntimeError("life expectancy unit mismatch")
          if life["row_count"] < 1_000:
              raise RuntimeError("life expectancy partition is unexpectedly small")

          values_2023 = {}
          for indicator_id in ("wb.ny.gdp.pcap.cd", "wb.sp.dyn.le00.in"):
              entry = indicators[indicator_id]
              observations = json.loads(
                  (root / "releases" / latest["release_id"] / entry["observations"])
                  .read_text(encoding="utf-8")
              )
              if len(observations) != entry["row_count"]:
                  raise RuntimeError(f"row count mismatch for {indicator_id}")
              values_2023[indicator_id] = {
                  row["geography_id"]
                  for row in observations
                  if row["period_label"] == "2023" and row["value"] is not None
              }

          paired = set.intersection(*values_2023.values())
          if len(paired) <= 100:
              raise RuntimeError(
                  f"only {len(paired)} complete GDP/life-expectancy pairs exist for 2023"
              )
          print(
              json.dumps(
                  {
                      "release_id": latest["release_id"],
                      "geographies": len(catalog["geographies"]),
                      "indicators": sorted(indicators),
                      "life_expectancy_rows": life["row_count"],
                      "paired_2023_rows": len(paired),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Start branch static server
        run: |
          python -m http.server 4173 --directory apps/web/dist > /tmp/worldinsights-http.log 2>&1 &
          echo $! > /tmp/worldinsights-http.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:4173/", timeout=5) as response:
                      if response.status == 200:
                          print("Branch static server is ready")
                          break
              except OSError:
                  pass
              if attempt == 29:
                  raise RuntimeError("branch static server did not become ready")
              time.sleep(1)
          PY

      - name: Install pinned Playwright and Chromium
        working-directory: apps/web
        run: |
          npm install --no-save @playwright/test@1.60.0
          npx playwright install --with-deps chromium

      - name: Run global life expectancy browser scenario
        working-directory: apps/web
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: npx playwright test --config=playwright.config.mjs --project=chromium

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: life-expectancy-browser-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
