name: Deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3

      - name: Validate repository
        run: make check

      - name: Build static explorer from global World Bank data
        env:
          WORLDINSIGHTS_RELEASE_MODE: live
          WORLDINSIGHTS_RELEASE_SCOPE: global
          WORLDINSIGHTS_START_YEAR: "2019"
          WORLDINSIGHTS_END_YEAR: "2024"
        run: npm --prefix apps/web run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy static explorer
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify deployed explorer
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test public Pages metadata
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base_url = os.environ["SITE_URL"].rstrip("/") + "/"

          def fetch(path: str) -> bytes:
              url = base_url + path
              last_error: Exception | None = None
              for attempt in range(12):
                  try:
                      request = Request(
                          url,
                          headers={"User-Agent": "WorldInsights deployment smoke test"},
                      )
                      with urlopen(request, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{url} returned HTTP {response.status}")
                          body = response.read()
                          if not body:
                              raise RuntimeError(f"{url} returned an empty response")
                          return body
                  except (HTTPError, URLError, RuntimeError) as error:
                      last_error = error
                      if attempt == 11:
                          break
                      time.sleep(5)
              raise RuntimeError(f"could not fetch {url}: {last_error}")

          index = fetch("").decode("utf-8")
          build = json.loads(fetch("build.json"))
          latest = json.loads(fetch("data/latest.json"))
          catalog = json.loads(fetch("data/" + latest["catalog"]))
          main_javascript = fetch("apps/web/src/main.js")
          stylesheet = fetch("styles.css")

          if "WorldInsights" not in index:
              raise RuntimeError("deployed index is missing the WorldInsights shell")
          if "apps/web/src/main.js" not in index:
              raise RuntimeError("deployed index does not reference the application entry point")
          if build.get("release_schema") != 2:
              raise RuntimeError("deployed build metadata has the wrong release schema")
          if build.get("release_mode") != "live":
              raise RuntimeError("production deployment did not use the live release builder")
          if build.get("release_scope") != "global":
              raise RuntimeError("production deployment did not use global release scope")
          if latest.get("schema_version") != 2:
              raise RuntimeError("deployed latest release is not the V2 catalog")
          release_id = str(latest.get("release_id", ""))
          if not release_id.startswith("world-bank-global-indicators-"):
              raise RuntimeError("production deployment did not publish a global release")
          if len(catalog.get("geographies", [])) < 200:
              raise RuntimeError("global release contains fewer than 200 geographies")

          required_indicator_ids = {
              "wb.ny.gdp.pcap.cd",
              "wb.sp.dyn.le00.in",
              "wb.sp.pop.totl",
          }
          indicators = {
              str(item.get("indicator_variant_id", "")): item
              for item in catalog.get("indicators", [])
          }
          if set(indicators) != required_indicator_ids:
              raise RuntimeError(
                  f"global release has the wrong indicator set: {sorted(indicators)}"
              )
          if any(item.get("row_count", 0) < 1_000 for item in indicators.values()):
              raise RuntimeError("global release indicator partitions are unexpectedly small")
          life_expectancy = indicators["wb.sp.dyn.le00.in"]
          if life_expectancy.get("provider_indicator_code") != "SP.DYN.LE00.IN":
              raise RuntimeError("life expectancy has the wrong provider identity")
          if life_expectancy.get("concept_id") != "health.life_expectancy_at_birth.total":
              raise RuntimeError("life expectancy has the wrong concept identity")
          if life_expectancy.get("unit_id") != "years":
              raise RuntimeError("life expectancy has the wrong unit")

          if len(main_javascript) < 1_000:
              raise RuntimeError("deployed application JavaScript is unexpectedly small")
          if len(stylesheet) < 1_000:
              raise RuntimeError("deployed stylesheet is unexpectedly small")

          print(f"Verified deployed WorldInsights site at {base_url}")
          print(f"Release: {release_id}")
          print(f"Geographies: {len(catalog['geographies'])}")
          print(f"Indicators: {', '.join(sorted(indicators))}")
          PY

      - name: Install pinned Playwright and Chromium
        working-directory: apps/web
        run: |
          npm install --no-save @playwright/test@1.60.0
          npx playwright install --with-deps chromium

      - name: Verify global user flows in Chromium
        working-directory: apps/web
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config=playwright.config.mjs --project=chromium

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-browser-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
