# WorldInsights Data Lake Indicators Configuration
# Use this file to manage which indicators are fetched from each source.
# Format:
# source_name:
#   description: "Optional description"
#   indicators:
#     - code: "API_CODE"
#       name: "Human Readable Name"

weather:
  description: "OpenMeteo Weather Variables"
  indicators:
    - code: "temperature_2m_mean"
      name: "Mean Daily Temperature"

worldbank:
  description: "World Bank Development Indicators"
  indicators:
    # Economy
    - code: "NY.GDP.MKTP.CD"
      name: "GDP (Current US$)"
    - code: "NY.GDP.PCAP.CD"
      name: "GDP per capita (Current US$)"
    - code: "FP.CPI.TOTL.ZG"
      name: "Inflation, consumer prices (annual %)"
    - code: "SL.UEM.TOTL.ZS"
      name: "Unemployment, total (% of total labor force)"

    # Population & Society
    - code: "SP.POP.TOTL"
      name: "Population, total"
    - code: "SP.DYN.LE00.IN"
      name: "Life expectancy at birth, total (years)"
    - code: "SE.ADT.LITR.ZS"
      name: "Literacy rate, adult total (% of people ages 15 and above)"

    # Environment
    - code: "EN.ATM.CO2E.PC"
      name: "CO2 emissions (metric tons per capita)"
    - code: "AG.LND.FRST.ZS"
      name: "Forest area (% of land area)"
    - code: "EG.USE.ELEC.KH.PC"
      name: "Electric power consumption (kWh per capita)"

who:
  description: "World Health Organization GHO"
  indicators:
    - code: "WHOSIS_000001"
      name: "Life expectancy at birth (years)"
    - code: "WHOSIS_000002"
      name: "Healthy life expectancy (HALE) at birth"
    - code: "WHOSIS_000015"
      name: "Adolescent birth rate (per 1000 women aged 15-19 years)"

fao:
  description: "Food and Agriculture Organization"
  indicators:
    - code: "QCL"
      name: "Crops and livestock products"

nasa:
  description: "NASA Power Project"
  indicators:
    - code: "ALLSKY_SFC_SW_DWN"
      name: "All Sky Surface Shortwave Downward Irradiance"
    - code: "T2M"
      name: "Temperature at 2 Meters"
